<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050c24">
  <meta name="description" content="Ludo Pro - classic Ludo board game. Developed by Sanaullah Khoso.">
  <title>Ludo Pro</title>
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/redesign.css">
</head>
<body>
<div id="app">

  <!-- ============ SPLASH ============ -->
  <section id="screen-splash" class="screen active">
    <img class="splash-logo" src="assets/images/logo.png" alt="Ludo Pro">
    <div class="splash-load"><span></span></div>
    <p class="dev-line">Developed by <b>Sanaullah Khoso</b></p>
  </section>

  <!-- ============ DASHBOARD ============ -->
  <section id="screen-home" class="screen">
    <header class="h-top">
      <button class="h-profile" data-go="profile" aria-label="Player profile">
        <span class="h-avatar"><span id="home-avatar">😎</span><i class="crown">👑</i></span>
        <span class="h-info">
          <b id="home-name">Player</b>
          <span class="h-chips">
            <em class="chip" title="Games played">🎲 <span id="home-games">0</span></em>
            <em class="chip" title="Wins">🏆 <span id="home-wins">0</span></em>
            <em class="chip" title="Win rate">🎯 <span id="home-rate">0</span>%</em>
          </span>
        </span>
      </button>
      <button class="round-btn green" data-go="settings" aria-label="Settings">⚙</button>
    </header>
    <div class="h-sub">
      <button class="coin-chip" data-go="rewards" aria-label="Coins and rewards">
        <img src="assets/icons/coin.png" alt=""><b id="home-coins">0</b><i class="plus">+</i>
        <em class="dot" id="home-dot" hidden></em>
      </button>
    </div>

    <div class="home-main">
      <img class="home-logo" src="assets/images/logo.png" alt="Ludo Pro logo">
      <div class="big-tiles">
        <button class="big-tile t-cpu" data-kind="cpu"><span class="bt-art">🤖<i>🎲</i></span><b>vs Computer</b></button>
        <button class="big-tile t-local" data-kind="local"><span class="bt-art">👫<i>🎲</i></span><b>Local Play</b></button>
      </div>
      <div class="small-tiles">
        <button class="small-tile s-pass" data-kind="passplay"><span>📱</span><b>Pass &amp; Play</b></button>
        <button class="small-tile s-power" data-kind="power"><span>✊</span><b>Power</b></button>
        <button class="small-tile s-token" data-go="tokens"><span id="home-token-art"></span><b>Tokens</b></button>
      </div>
      <button class="continue-pill" id="btn-continue" hidden>
        <span class="cp-play">▶</span><span class="cp-text"><b>Continue Last Game</b><small id="continue-info"></small></span>
      </button>
    </div>
    <nav class="bottom-nav">
      <button data-go="history"><span>📜</span>History</button>
      <button class="active"><span>🎲</span>Ludo</button>
      <button data-go="rewards"><span>🎁</span>Rewards<em class="dot" id="tile-dot" hidden></em></button>
    </nav>
    <p class="dev-line">Developed by <b>Sanaullah Khoso</b> · Virtual coins only, no real money</p>
  </section>

  <!-- ============ GAME MODE (variants) ============ -->
  <section id="screen-modes" class="screen">
    <div class="mode-head"><div class="tab-pill on"><span>🎲</span>Normal</div></div>
    <div class="scroll" id="variant-list">
      <button class="variant sel" data-variant="classic"><span class="v-ic v-classic">🎲</span><span class="v-tx"><b>Classic</b><small>Home all pawns to win the game</small></span><i class="v-info" data-info="classic">i</i></button>
      <button class="variant" data-variant="timed"><span class="v-ic v-timed">⏱</span><span class="v-tx"><b>5 Minutes</b><small>Top score under time limit wins</small></span><i class="v-info" data-info="timed">i</i></button>
      <button class="variant" data-variant="quick"><span class="v-ic v-quick">🐇</span><span class="v-tx"><b>Quick</b><small>Kill one pawn and home one pawn to win</small></span><i class="v-info" data-info="quick">i</i></button>
      <button class="variant" data-variant="deathmatch"><span class="v-ic v-death">💀</span><span class="v-tx"><b>Deathmatch</b><small>Kill 4 opponent pawns to win</small></span><i class="v-info" data-info="deathmatch">i</i></button>
      <button class="variant" data-variant="power"><span class="v-ic v-power">✊</span><span class="v-tx"><b>Power</b><small>Use spells: Pick Dice, Shield, Blast</small></span><i class="v-info" data-info="power">i</i></button>
    </div>
    <footer class="nav-foot"><button class="round-btn green" data-back aria-label="Back">←</button><button class="btn btn-green btn-play" id="btn-variant-play">PLAY</button><span class="nf-space"></span></footer>
  </section>

  <!-- ============ PLAYERS + COLOUR ============ -->
  <section id="screen-setup" class="screen">
    <h2 class="fancy-title" id="setup-title">Computer</h2>
    <div class="mode-chip" id="setup-chip">Normal · Classic</div>
    <div class="scroll" id="setup-body"></div>
    <footer class="nav-foot"><button class="round-btn green" data-back aria-label="Back">←</button><button class="btn btn-green btn-play" id="btn-start-game">PLAY</button><span class="nf-space"></span></footer>
  </section>

  <!-- ============ TOKEN SELECT ============ -->
  <section id="screen-tokens" class="screen">
    <header class="tok-head"><button class="round-btn green" data-back aria-label="Back">←</button><h2 class="fancy-title">SELECT TOKEN</h2><span></span></header>
    <div class="tok-stage" id="tok-stage"></div>
    <div class="tok-name" id="tok-name">Pointy</div>
    <div class="scroll tok-grid" id="tok-grid"></div>
    <footer class="nav-foot"><button class="btn btn-green btn-equip" id="btn-equip">Equip</button></footer>
  </section>

  <!-- ============ GAME ============ -->
  <section id="screen-game" class="screen">
    <div class="game-bg" id="game-bg"></div>
    <div class="g-row g-top">
      <div class="holder h-left" data-seat="0"></div>
      <div class="goal-chip" id="goal-chip"><b id="goal-main">Ludo</b><small id="goal-sub">Turn 1</small></div>
      <div class="holder h-right" data-seat="1"></div>
    </div>
    <div class="board-wrap"><div id="board"></div></div>
    <div class="g-row g-bot">
      <div class="holder h-left" data-seat="3"></div>
      <div class="status-line" id="status-line">Welcome to Ludo Pro</div>
      <div class="holder h-right" data-seat="2"></div>
    </div>
    <div class="spell-bar" id="spell-bar" hidden>
      <button class="spell" data-spell="dice" disabled><span>🎯</span>Pick Dice<em>0</em></button>
      <button class="spell" data-spell="shield" disabled><span>🛡️</span>Shield<em>0</em></button>
      <button class="spell" data-spell="blast" disabled><span>💥</span>Blast<em>0</em></button>
    </div>
    <footer class="game-bar">
      <button class="round-btn green" id="btn-back" aria-label="Back">←</button>
      <button class="round-btn green dim" id="btn-snd" aria-label="Sound">🔊</button>
      <div class="gb-mode"><b id="game-mode">Solo</b><small id="game-variant">Classic</small></div>
      <button class="round-btn green" id="btn-quit" aria-label="Quit">🏃</button>
      <button class="round-btn green" id="btn-pause" aria-label="Menu">⚙</button>
    </footer>
    <!-- the 3D dice flies from the player's holder to the middle of the board and back -->
    <div class="dice-fly" id="dice-spot" hidden>
      <div class="dice" id="dice" data-v="1">
        <div class="face f1"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="face f2"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="face f3"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="face f4"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="face f5"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <div class="face f6"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
      </div>
    </div>
  </section>

  <!-- ============ RESULT ============ -->
  <section id="screen-result" class="screen">
    <div class="scroll result-scroll">
      <div class="trophy">🏆</div>
      <h1 id="res-title">Winner!</h1>
      <p class="res-sub" id="res-sub"></p>
      <div class="card" id="res-ranks"></div>
      <div class="card" id="res-reward"></div>
      <div class="res-actions">
        <button class="btn btn-gold btn-lg" id="res-again">↻ Play Again</button>
        <button class="btn btn-blue" id="res-menu">⌂ Main Menu</button>
      </div>
    </div>
    <div class="confetti" id="confetti"></div>
  </section>

  <!-- ============ SETTINGS ============ -->
  <section id="screen-settings" class="screen">
    <header class="page-head"><button class="back" data-back aria-label="Back">‹</button><h2>Settings</h2><span></span></header>
    <div class="scroll" id="settings-body"></div>
  </section>

  <!-- ============ HISTORY ============ -->
  <section id="screen-history" class="screen">
    <header class="page-head"><button class="back" data-back aria-label="Back">‹</button><h2>Game History</h2><button class="icon-btn small" id="btn-clear-history" aria-label="Clear history">🗑</button></header>
    <div class="scroll" id="history-body"></div>
  </section>

  <!-- ============ PROFILE ============ -->
  <section id="screen-profile" class="screen">
    <header class="page-head"><button class="back" data-back aria-label="Back">‹</button><h2>Player Profile</h2><span></span></header>
    <div class="scroll" id="profile-body"></div>
  </section>

  <!-- ============ REWARDS ============ -->
  <section id="screen-rewards" class="screen">
    <header class="page-head"><button class="back" data-back aria-label="Back">‹</button><h2>Rewards</h2><span></span></header>
    <div class="scroll" id="rewards-body"></div>
  </section>

  <!-- ============ OVERLAYS ============ -->
  <div id="overlay" class="overlay" hidden>
    <div class="modal" id="modal"></div>
  </div>
  <div id="toast" class="toast" hidden></div>
</div>

<script src="js/storage.js"></script>
<script src="js/data.js"></script>
<script src="js/economy.js"></script>
<script src="js/audio.js"></script>
<script src="js/ludo-engine.js"></script>
<script src="js/ludo-ai.js"></script>
<script src="js/ludo-board.js"></script>
<script src="js/game-controller.js"></script>
<script src="js/app.js"></script>
</body>
</html>
