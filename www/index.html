<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#050c24">
  <meta name="description" content="Ludo Pro - classic Ludo board game. Developed by Sanaullah Khoso.">
  <title>Ludo Pro</title>
  <link rel="icon" href="assets/icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">

  <!-- ============ SPLASH ============ -->
  <section id="screen-splash" class="screen active">
    <img class="splash-logo" src="assets/images/logo.png" alt="Ludo Pro">
    <div class="splash-load"><span></span></div>
    <p class="dev-line">Developed by <b>Sanaullah Khoso</b></p>
  </section>

  <!-- ============ DASHBOARD ============ -->
  <section id="screen-home" class="screen">
    <header class="topbar">
      <button class="profile-chip" data-go="profile" aria-label="Player profile">
        <span class="avatar" id="home-avatar">😎</span>
        <span class="pc-text"><b id="home-name">Player</b><small id="home-level">Level 1</small></span>
      </button>
      <button class="coin-chip" data-go="rewards" aria-label="Coins and rewards">
        <img src="assets/icons/coin.png" alt=""><b id="home-coins">0</b><i class="plus">+</i>
        <em class="dot" id="home-dot" hidden></em>
      </button>
    </header>

    <div class="home-main">
      <img class="home-logo" src="assets/images/logo.png" alt="Ludo Pro logo">
      <button class="btn btn-gold btn-xl" id="btn-play">▶ PLAY</button>
      <button class="btn btn-blue btn-lg" id="btn-continue" hidden>⟳ Continue game <small id="continue-info"></small></button>
      <div class="home-grid">
        <button class="tile" data-go="rewards"><span>🎁</span>Rewards<em class="dot" id="tile-dot" hidden></em></button>
        <button class="tile" data-go="history"><span>📜</span>History</button>
        <button class="tile" data-go="profile"><span>👤</span>Profile</button>
        <button class="tile" data-go="settings"><span>⚙️</span>Settings</button>
      </div>
    </div>
    <p class="dev-line">Developed by <b>Sanaullah Khoso</b> · Virtual coins only, no real money</p>
  </section>

  <!-- ============ MODE SELECT ============ -->
  <section id="screen-modes" class="screen">
    <header class="page-head"><button class="back" data-back aria-label="Back">‹</button><h2>Select Game Mode</h2><span></span></header>
    <div class="scroll">
      <button class="mode-card" data-mode="cpu"><span class="mc-ic">🤖</span><span class="mc-tx"><b>Play vs Computer</b><small>Easy, Medium or Hard opponents</small></span><i>›</i></button>
      <button class="mode-card" data-mode="local2"><span class="mc-ic">👥</span><span class="mc-tx"><b>Two Players Offline</b><small>Two friends, one device</small></span><i>›</i></button>
      <button class="mode-card" data-mode="local3"><span class="mc-ic">👨‍👩‍👦</span><span class="mc-tx"><b>Three Players Offline</b><small>Three friends, one device</small></span><i>›</i></button>
      <button class="mode-card" data-mode="local4"><span class="mc-ic">🎲</span><span class="mc-tx"><b>Four Players Offline</b><small>The full classic Ludo table</small></span><i>›</i></button>
      <button class="mode-card" data-mode="passplay"><span class="mc-ic">📱</span><span class="mc-tx"><b>Pass and Play</b><small>Hand-over screen between turns</small></span><i>›</i></button>
    </div>
  </section>

  <!-- ============ PLAYER SELECTION ============ -->
  <section id="screen-setup" class="screen">
    <header class="page-head"><button class="back" data-back aria-label="Back">‹</button><h2 id="setup-title">Players</h2><span></span></header>
    <div class="scroll" id="setup-body"></div>
    <footer class="foot"><button class="btn btn-gold btn-lg" id="btn-start-game">START GAME</button></footer>
  </section>

  <!-- ============ GAME ============ -->
  <section id="screen-game" class="screen">
    <header class="game-top">
      <button class="icon-btn" id="btn-pause" aria-label="Menu">☰</button>
      <div class="game-title"><b id="game-mode">Ludo</b><small id="game-turn">Turn 1</small></div>
      <button class="icon-btn" id="btn-snd" aria-label="Sound">🔊</button>
    </header>
    <div class="players-strip" id="players-strip"></div>
    <div class="board-wrap"><div id="board"></div></div>
    <div class="status-line" id="status-line">Welcome to Ludo Pro</div>
    <div class="dice-bar">
      <div class="dice-spot" id="dice-spot">
        <div class="dice" id="dice" data-v="1" role="button" aria-label="Dice">
          <i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i>
        </div>
      </div>
      <button class="btn btn-gold roll-btn" id="btn-roll" disabled>ROLL</button>
    </div>
  </section>

  <!-- ============ RESULT ============ -->
  <section id="screen-result" class="screen">
    <div class="scroll result-scroll">
      <div class="trophy">🏆</div>
      <h1 id="res-title">Winner!</h1>
      <p class="res-sub" id="res-sub"></p>
      <div class="card" id="res-ranks"></div>
      <div class="card" id="res-reward"></div>
      <div class="res-actions">
        <button class="btn btn-gold btn-lg" id="res-again">↻ Play Again</button>
        <button class="btn btn-blue" id="res-menu">⌂ Main Menu</button>
      </div>
    </div>
    <div class="confetti" id="confetti"></div>
  </section>

  <!-- ============ SETTINGS ============ -->
  <section id="screen-settings" class="screen">
    <header class="page-head"><button class="back" data-back aria-label="Back">‹</button><h2>Settings</h2><span></span></header>
    <div class="scroll" id="settings-body"></div>
  </section>

  <!-- ============ HISTORY ============ -->
  <section id="screen-history" class="screen">
    <header class="page-head"><button class="back" data-back aria-label="Back">‹</button><h2>Game History</h2><button class="icon-btn small" id="btn-clear-history" aria-label="Clear history">🗑</button></header>
    <div class="scroll" id="history-body"></div>
  </section>

  <!-- ============ PROFILE ============ -->
  <section id="screen-profile" class="screen">
    <header class="page-head"><button class="back" data-back aria-label="Back">‹</button><h2>Player Profile</h2><span></span></header>
    <div class="scroll" id="profile-body"></div>
  </section>

  <!-- ============ REWARDS ============ -->
  <section id="screen-rewards" class="screen">
    <header class="page-head"><button class="back" data-back aria-label="Back">‹</button><h2>Rewards</h2><span></span></header>
    <div class="scroll" id="rewards-body"></div>
  </section>

  <!-- ============ OVERLAYS ============ -->
  <div id="overlay" class="overlay" hidden>
    <div class="modal" id="modal"></div>
  </div>
  <div id="toast" class="toast" hidden></div>
</div>

<script src="js/storage.js"></script>
<script src="js/data.js"></script>
<script src="js/economy.js"></script>
<script src="js/audio.js"></script>
<script src="js/ludo-engine.js"></script>
<script src="js/ludo-ai.js"></script>
<script src="js/ludo-board.js"></script>
<script src="js/game-controller.js"></script>
<script src="js/app.js"></script>
</body>
</html>
