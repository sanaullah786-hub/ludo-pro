name: Build Android APK

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Run automated game tests
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Create the Android project if it is not in the repository
        run: |
          if [ ! -f android/gradlew ]; then
            rm -rf android
            npx cap add android
          fi

      - name: Generate app icons and splash screens
        continue-on-error: true
        run: |
          npx capacitor-assets generate --android || echo "::warning::capacitor-assets failed"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Patch Android project
        run: node scripts/patch-android.js

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Install the Android platform
        run: |
          SDK=$(grep -oP 'compileSdkVersion\s*=\s*\K[0-9]+' android/variables.gradle || true)
          SDK=${SDK:-35}
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-$SDK" "platform-tools"

      - name: Build debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify the APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::APK was not produced"; exit 1; }
          ls -l "$APK"
          mkdir -p dist
          cp "$APK" dist/LudoPro-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LudoPro-debug-apk
          path: dist/LudoPro-debug.apk
          if-no-files-found: error
          retention-days: 30
