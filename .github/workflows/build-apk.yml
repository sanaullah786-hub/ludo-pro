name: Build Android APK

# Builds a debug APK of Ludo Pro and uploads it as a workflow artifact.
# Developer: Sanaullah Khoso

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach the APK to a GitHub Release on version tags

jobs:
  build-apk:
    name: Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JDK 21 (required by Capacitor 7 / Android Gradle Plugin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install project dependencies
        run: npm install --no-audit --no-fund

      - name: Run automated game tests
        run: npm test

      - name: Build web assets
        run: npm run build

      - name: Create the Android project if it is not in the repository
        run: |
          if [ ! -f android/gradlew ]; then
            echo "No generated Android project found - running 'cap add android'"
            rm -rf android
            npx cap add android
          fi

      - name: Generate app icons and splash screens
        continue-on-error: true
        run: |
          npx capacitor-assets generate --android || echo "::warning::capacitor-assets failed - the default Capacitor icons will be used"

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Patch Android project (portrait, version)
        run: node scripts/patch-android.js

      - name: Configure Android SDK (preinstalled on GitHub's Ubuntu runners)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME" || { echo "::error::Android SDK not found"; exit 1; }
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Install the Android platform that the project compiles against
        run: |
          SDK=$(grep -oP 'compileSdkVersion\s*=\s*\K[0-9]+' android/variables.gradle || true)
          SDK=${SDK:-35}
          echo "compileSdkVersion = $SDK"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | sort -V | tail -1)
          echo "sdkmanager = $SDKM"
          test -x "$SDKM" || { echo "::error::sdkmanager not found in $ANDROID_HOME/cmdline-tools"; exit 1; }
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-$SDK" "platform-tools"

      - name: Build debug APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify the APK
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK" || { echo "::error::APK was not produced"; exit 1; }
          ls -l "$APK"
          unzip -l "$APK" | grep -q "assets/public/index.html" || { echo "::error::web assets are missing from the APK"; exit 1; }
          unzip -l "$APK" | grep -q "assets/public/js/ludo-engine.js" || { echo "::error::game engine missing from the APK"; exit 1; }
          mkdir -p dist
          cp "$APK" dist/LudoPro-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LudoPro-debug-apk
          path: dist/LudoPro-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Attach APK to GitHub Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/LudoPro-debug.apk
          generate_release_notes: true
